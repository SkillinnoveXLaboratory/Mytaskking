name: Build macOS Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example v1.0.0. Leave blank to build an artifact only."
        required: false
        type: string

jobs:
  build-macos-installer:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend/flutter_apps/macos_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build unsigned macOS installer
        shell: bash
        run: bash ./build_macos.sh

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: mytaskking-macos-installer
          path: |
            frontend/flutter_apps/macos_app/dist/*.dmg
            frontend/flutter_apps/macos_app/dist/*.zip
          if-no-files-found: error

      # GitHub Actions artifacts are always delivered as ZIP files. A release
      # asset is the supported way to offer the .dmg itself as a direct download.
      - name: Publish DMG release asset
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: MyTaskKing ${{ inputs.release_tag }}
          generate_release_notes: true
          files: frontend/flutter_apps/macos_app/dist/*.dmg
