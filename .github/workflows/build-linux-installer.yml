name: Build Linux Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-linux-installer.yml"
      - "frontend/flutter_apps/linux_app/**"
      - "frontend/flutter_apps/mobile_app/**"
      - "frontend/flutter_apps/shared_core/**"
      - "frontend/flutter_apps/shared_design_system/**"

jobs:
  build-linux-installer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/flutter_apps/linux_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libx11-dev \
            libxss-dev \
            libxtst-dev \
            liblzma-dev \
            libsecret-1-dev \
            libunwind-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build Linux release bundle
        run: |
          flutter build linux --release \
            --dart-define=API_URL=https://mytaskking.com \
            --dart-define=SOCKET_URL=https://mytaskking.com

      - name: Package Debian installer and portable archive
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version: \([0-9][^+]*\).*/\1/p' pubspec.yaml)"
          if [ -z "$version" ]; then
            echo "Could not read the app version from pubspec.yaml."
            exit 1
          fi

          bundle="build/linux/x64/release/bundle"
          package_root="build/package/mytaskking_${version}_amd64"
          output="dist"

          test -x "$bundle/mytaskking_linux"
          rm -rf "$package_root" "$output"
          mkdir -p \
            "$package_root/DEBIAN" \
            "$package_root/opt/mytaskking" \
            "$package_root/usr/bin" \
            "$package_root/usr/share/applications" \
            "$package_root/usr/share/icons/hicolor/256x256/apps" \
            "$output"

          cp -a "$bundle/." "$package_root/opt/mytaskking/"
          cp assets/logo.png "$package_root/usr/share/icons/hicolor/256x256/apps/mytaskking.png"

          cat > "$package_root/DEBIAN/control" <<EOF
          Package: mytaskking
          Version: $version
          Section: office
          Priority: optional
          Architecture: amd64
          Maintainer: MyTaskKing <support@mytaskking.com>
          Depends: libgtk-3-0, libglib2.0-0, libstdc++6, liblzma5, libunwind8, libxtst6, libsecret-1-0
          Description: MyTaskKing desktop workspace
           MyTaskKing provides chat, tasks, calls, meetings, and work tools.
          EOF

          cat > "$package_root/usr/bin/mytaskking" <<'EOF'
          #!/usr/bin/env sh
          exec /opt/mytaskking/mytaskking_linux "$@"
          EOF
          chmod 0755 "$package_root/usr/bin/mytaskking"

          cat > "$package_root/usr/share/applications/mytaskking.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MyTaskKing
          Comment=MyTaskKing desktop workspace
          Exec=mytaskking
          Icon=mytaskking
          Terminal=false
          Categories=Office;Utility;
          StartupWMClass=com.mytaskking.linux
          EOF

          dpkg-deb --build --root-owner-group "$package_root" "$output/mytaskking_${version}_amd64.deb"
          tar -C "$bundle" -czf "$output/mytaskking-linux-x64.tar.gz" .

      - name: Validate installer contents
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -q '/usr/bin/mytaskking$'
          dpkg-deb --contents "$deb" | grep -q '/opt/mytaskking/mytaskking_linux$'

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: mytaskking-linux-installer
          path: |
            frontend/flutter_apps/linux_app/dist/*.deb
            frontend/flutter_apps/linux_app/dist/*.tar.gz
          if-no-files-found: error
