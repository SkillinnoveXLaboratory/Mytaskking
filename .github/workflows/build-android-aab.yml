name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-android-aab.yml"
      - "frontend/flutter_apps/mobile_app/**"
      - "frontend/flutter_apps/shared_core/**"
      - "frontend/flutter_apps/shared_design_system/**"

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/flutter_apps/mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get packages
        run: flutter pub get

      - name: Decode signing keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create signing configuration
        shell: bash
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          EOF

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mytaskking-v1.0.0-aab
          path: frontend/flutter_apps/mobile_app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
