name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Prepare Agora Windows plugin
        working-directory: frontend/flutter_apps/windows_app
        shell: powershell
        run: |
          flutter pub get
          $pluginLink = Join-Path $PWD "windows/flutter/ephemeral/.plugin_symlinks/agora_rtc_engine"
          if (Test-Path -LiteralPath $pluginLink) {
            $pluginItem = Get-Item -LiteralPath $pluginLink -Force
            $pluginTarget = $pluginItem.Target
            if (-not $pluginTarget) {
              $pluginTarget = (Resolve-Path -LiteralPath $pluginLink -ErrorAction Stop).Path
            }
            if (-not $pluginTarget) {
              throw "Agora plugin link target could not be resolved: $pluginLink"
            }
            if (-not [System.IO.Path]::IsPathRooted($pluginTarget)) {
              $pluginTarget = Join-Path (Split-Path $pluginLink) $pluginTarget
            }
            $pluginTarget = (Resolve-Path -LiteralPath $pluginTarget).Path

            $cmakeFile = Join-Path $pluginTarget "windows/cmake/DownloadSDK.cmake"
            $cmakeText = Get-Content -LiteralPath $cmakeFile -Raw
            $sdkMatches = [regex]::Matches(
              $cmakeText,
              'set\((IRIS|NATIVE)_SDK_DOWNLOAD_URL "([^"]+)"\)'
            )
            foreach ($match in $sdkMatches) {
              $sdkName = $match.Groups[1].Value.ToLowerInvariant()
              $sdkUrl = $match.Groups[2].Value
              $sdkDir = Join-Path $pluginTarget "windows/third_party/$sdkName"
              # Agora's CMake script searches inside <sdk>/lib after extraction.
              $extractDir = Join-Path $sdkDir "lib"
              $sdkZip = Join-Path $sdkDir ([System.IO.Path]::GetFileName($sdkUrl))
              New-Item -ItemType Directory -Path $sdkDir -Force | Out-Null
              New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
              if (-not (Test-Path -LiteralPath $sdkZip)) {
                Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkZip
              }
              Push-Location $extractDir
              & cmake -E tar xzf $sdkZip
              $extractExit = $LASTEXITCODE
              Pop-Location
              if ($extractExit -ne 0) {
                throw "Failed to extract Agora $sdkName SDK"
              }
              $sdkDirectories = Get-ChildItem -LiteralPath $extractDir -Directory -Recurse
              $irisInclude = $sdkDirectories | Where-Object { $_.Name -eq "include" -and $_.Parent.Name -eq "x64" }
              $irisRelease = $sdkDirectories | Where-Object { $_.Name -eq "Release" -and $_.Parent.Name -eq "x64" }
              $nativeRoot = $sdkDirectories | Where-Object { $_.Name -eq "sdk" }
              if ($sdkName -eq "iris" -and (-not $irisInclude -or -not $irisRelease)) {
                throw "Agora Iris SDK is missing lib/x64/include after extraction"
              }
              if ($sdkName -eq "native" -and -not $nativeRoot) {
                throw "Agora Native SDK is missing lib/sdk after extraction"
              }
            }
            New-Item -ItemType File -Path (Join-Path $pluginTarget "windows/.plugin_dev") -Force | Out-Null
          }

      - name: Build installer
        working-directory: frontend/flutter_apps/windows_app
        shell: powershell
        run: .\build_installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mytaskking-windows-installer
          path: frontend/flutter_apps/windows_app/build/installer/*.exe
          if-no-files-found: error
