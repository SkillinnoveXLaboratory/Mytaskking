name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Prepare Agora Windows plugin
        working-directory: frontend/flutter_apps/windows_app
        shell: powershell
        run: |
          flutter pub get
          $pluginLink = Join-Path $PWD "windows/flutter/ephemeral/.plugin_symlinks/agora_rtc_engine"
          if (Test-Path -LiteralPath $pluginLink) {
            $pluginTarget = (Get-Item -LiteralPath $pluginLink -Force).Target
            if (-not $pluginTarget) {
              throw "Agora plugin link target could not be resolved: $pluginLink"
            }
            if (-not [System.IO.Path]::IsPathRooted($pluginTarget)) {
              $pluginTarget = Join-Path (Split-Path $pluginLink) $pluginTarget
            }
            $pluginTarget = (Resolve-Path -LiteralPath $pluginTarget).Path
            Remove-Item -LiteralPath $pluginLink -Force
            Copy-Item -LiteralPath $pluginTarget -Destination $pluginLink -Recurse -Force
          }

      - name: Build installer
        working-directory: frontend/flutter_apps/windows_app
        shell: powershell
        run: .\build_installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mytaskking-windows-installer
          path: frontend/flutter_apps/windows_app/build/installer/*.exe
          if-no-files-found: error
